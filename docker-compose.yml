services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: queuescope
      POSTGRES_PASSWORD: queuescope
      POSTGRES_USER: queuescope
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U queuescope -d queuescope']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - queuescope-postgres:/var/lib/postgresql/data

volumes:
  queuescope-postgres:
